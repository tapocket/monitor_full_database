name: Daily CBR Rates, Price History, Checklist & Portal Rebuild

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build dependencies & LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
          pip install --quiet openpyxl jsonschema
      - name: Update CBR EUR/USD/CNY rates & sync database_master.json
        run: python3 scripts/update_cbr_rates.py --config config/rates.json --master database_master.json
      - name: Refresh live RF store prices sample (best-effort)
        run: python3 scripts/collect_rf_prices.py --master database_master.json --snapshot data/prices_rf_snapshot.json --limit 40 || true
      - name: Record RF price history snapshot
        run: python3 scripts/record_price_history.py --snapshot data/prices_rf_snapshot.json --history-dir data/price_history
      - name: Generate daily maintenance checklist
        run: python3 scripts/update_checklist.py
      - name: Run daily RSS/Telegram review radar
        run: python3 scripts/check_new_reviews.py
      - name: Run sample link health check
        run: python3 scripts/check_links.py --master database_master.json --out data/link_health_report.json --md-out data/LINK_AUDIT_REPORT.md --sample 120
      - name: Rebuild portal, Excel & API and verify parity
        run: |
          python3 build_database.py --master database_master.json --template-xlsx monitor_full_database.xlsx --template-html monitor_full_database.html --outdir . --recalc --verify
      - name: Bump Service Worker cache key if portal changed
        run: |
          if ! git diff --quiet monitor_full_database.html database_master.json; then
            python3 - <<'PYEOF'
          import datetime, re
          with open("sw.js", "r", encoding="utf-8") as f: sw = f.read()
          tag = "monitor-db-cache-" + datetime.date.today().isoformat()
          sw = re.sub(r"monitor-db-cache-[0-9a-zA-Z_-]+", tag, sw)
          with open("sw.js", "w", encoding="utf-8") as f: f.write(sw)
          PYEOF
          fi
      - name: Commit updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/rates.json database_master.json monitor_full_database.xlsx monitor_full_database.html index.html data/db_payload.js monitor_full_database.csv sw.js data/link_health_report.json data/LINK_AUDIT_REPORT.md data/DAILY_UPDATE_CHECKLIST.md data/new_reviews_radar.json data/prices_rf_snapshot.json data/price_history/ api/v1/
          git diff --staged --quiet || git commit -m "chore: daily CBR rates, checklist & portal rebuild"
          git push
      - name: Notify admin in Telegram if new reviews or dead links found
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python3 scripts/notify_ci_telegram.py
