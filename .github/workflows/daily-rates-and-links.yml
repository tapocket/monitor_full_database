name: Daily CBR Rates & Link Health Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update CBR EUR/USD/CNY rates
        run: python3 scripts/update_cbr_rates.py --config config/rates.json
      - name: Run sample link health check
        run: python3 scripts/check_links.py --master database_master.json --out data/link_health_report.json --sample 100
      - name: Commit updates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/rates.json data/link_health_report.json
          git diff --staged --quiet || git commit -m "chore: daily CBR rates & link health check"
          git push
