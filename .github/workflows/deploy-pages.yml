name: Deploy Portal & Static JSON API to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare dual-mode static site (fast split index.html + standalone offline HTML + JSON API)
        run: |
          mkdir -p _site/data/price_history _site/api/v1 _site/docs/screenshots
          cp index.html monitor_full_database.html manifest.webmanifest sw.js _site/
          cp data/db_payload.js data/prices_rf_snapshot.json data/icc_profiles.json _site/data/
          cp data/price_history/*.jsonl _site/data/price_history/ || true
          cp docs/screenshots/*.png _site/docs/screenshots/ || true
          python3 -c "
          import json
          m = json.load(open('database_master.json', encoding='utf-8'))
          json.dump(m['catalog'], open('_site/api/v1/monitors.json', 'w', encoding='utf-8'), ensure_ascii=False)
          brands = sorted(set(x.get('brand_canonical', x.get('brand', '')) for x in m['catalog']))
          json.dump({'count': len(brands), 'brands': brands}, open('_site/api/v1/brands.json', 'w', encoding='utf-8'), ensure_ascii=False)
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
