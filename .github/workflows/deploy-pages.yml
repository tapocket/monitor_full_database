name: Deploy Portal & Static JSON API to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile minified Tailwind CSS (no runtime CDN)
        run: |
          npm install
          npm run build:css
      - name: Prepare static site, inline compiled CSS & JSON API
        run: |
          mkdir -p _site/data/price_history _site/api/v1 _site/docs/screenshots
          python3 -c "
          html = open('monitor_full_database.html', encoding='utf-8').read()
          css = open('dist/tailwind.min.css', encoding='utf-8').read()
          cdn_tag = '<script src=\"https://cdn.tailwindcss.com/3.4.17\"></script>'
          if cdn_tag in html:
              html = html.replace(cdn_tag, '<style id=\"compiled-tailwind\">' + css + '</style>', 1)
          open('_site/index.html', 'w', encoding='utf-8').write(html)
          open('_site/monitor_full_database.html', 'w', encoding='utf-8').write(html)
          "
          cp manifest.webmanifest sw.js _site/
          cp data/prices_rf_snapshot.json data/icc_profiles.json _site/data/
          cp data/price_history/*.jsonl _site/data/price_history/ || true
          cp docs/screenshots/*.png _site/docs/screenshots/ || true
          python3 -c "
          import json
          m = json.load(open('database_master.json', encoding='utf-8'))
          json.dump(m['catalog'], open('_site/api/v1/monitors.json', 'w', encoding='utf-8'), ensure_ascii=False)
          brands = sorted(set(x.get('brand_canonical', x.get('brand', '')) for x in m['catalog']))
          json.dump({'count': len(brands), 'brands': brands}, open('_site/api/v1/brands.json', 'w', encoding='utf-8'), ensure_ascii=False)
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
